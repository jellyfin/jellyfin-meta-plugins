on:
  workflow_call:
    inputs:
      repository-name:
        required: true
        type: string
    secrets:
      token:
        required: true

jobs:
  autolabel:
    runs-on: ubuntu-latest
    if: ${{ github.repository == inputs.repository-name }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Autolabel Pull Request
        uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          token: ${{ secrets.token }}
