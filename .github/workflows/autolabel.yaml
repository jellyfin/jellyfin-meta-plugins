on:
  workflow_call:
    inputs:
      repository-name:
        required: true
        type: string
    secrets:
      token:
        required: true

jobs:
  autolabel:
    runs-on: ubuntu-latest
    if: ${{ github.repository == inputs.repository-name }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Autolabel Pull Request
        uses: release-drafter/release-drafter/autolabeler@c2e2804cc59f45f57076a99af580d0fedb697927 # v7.3.0
        with:
          token: ${{ secrets.token }}
