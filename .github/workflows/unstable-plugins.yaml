name: Create Unstable Plugin Branches

on:
  schedule:
    # Fallback: run Monday at 08:00 UTC if jellyfin-packaging dispatch never arrives
    - cron: '0 8 * * 1'
  workflow_dispatch:
  repository_dispatch:
    types:
      - jellyfin-unstable-build

permissions:
  contents: read

jobs:
  create-unstable-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Configure
        env:
          GH_TOKEN: ${{ secrets.JF_BOT_TOKEN }}
          NUGET_AUTH_TOKEN: ${{ secrets.JF_BOT_TOKEN }}
        run: |
          git config --global user.name "jellyfin-bot"
          git config --global user.email "team@jellyfin.org"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          mkdir -p ~/.nuget/NuGet
          cat > ~/.nuget/NuGet/NuGet.Config << NUGETEOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
              <add key="jellyfin-pre" value="https://nuget.pkg.github.com/jellyfin/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <jellyfin-pre>
                <add key="Username" value="jellyfin-bot" />
                <add key="ClearTextPassword" value="${NUGET_AUTH_TOKEN}" />
              </jellyfin-pre>
            </packageSourceCredentials>
          </configuration>
          NUGETEOF

      - name: Create unstable branches
        env:
          GH_TOKEN: ${{ secrets.JF_BOT_TOKEN }}
        run: python3 unstable_plugins.py
